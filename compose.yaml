# ARR Stack: Prowlarr + Sonarr + Radarr + qBittorrent + Jellyfin
# Change WEB_BIND_IP in .env to a trusted LAN address if you want LAN browser access.
# By default, administrative web interfaces bind only to localhost.

services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/prowlarr:/config
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:9696:9696"
    networks: [arr-net]
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/sonarr:/config
      - ./data:/data
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8989:8989"
    networks: [arr-net]
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/radarr:/config
      - ./data:/data
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:7878:7878"
    networks: [arr-net]
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: 8080
      TORRENTING_PORT: ${BT_PORT:-6881}
    volumes:
      - ./config/qbittorrent:/config
      - ./data:/data
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8080:8080"
      - "${BT_BIND_IP:-0.0.0.0}:${BT_PORT:-6881}:${BT_PORT:-6881}/tcp"
      - "${BT_BIND_IP:-0.0.0.0}:${BT_PORT:-6881}:${BT_PORT:-6881}/udp"
    networks: [arr-net]
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ./config/jellyfin:/config
      - ./data/media:/media:ro
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:8096:8096"
    networks: [arr-net]
    restart: unless-stopped

networks:
  arr-net:
    driver: bridge
